name: Desktop release checks
on:
  pull_request:
  push:
    branches: [master, develop, 'release/**']
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
      - run: python -m pip install build twine flake8 black==26.3.1 bandit
      - run: flake8 main.py focus_app.py build.py src tests --select=E9,F63,F7,F82 --show-source
      - run: black --check main.py focus_app.py build.py src tests
      - run: bandit -r src -lll -q
      - name: Build wheel and source archive
        working-directory: ${{ runner.temp }}
        run: python -m build "$GITHUB_WORKSPACE" --outdir "$GITHUB_WORKSPACE/dist"
      - run: twine check dist/*
      - name: Install and check the distributed wheel
        run: |
          python -m pip install dist/*.whl
          cd "$RUNNER_TEMP"
          focus --version
          python -m pip check
          python -c "from pathlib import Path; import src; p=Path(src.__file__).parent; assert (p/'focus_track.lua').is_file() and (p/'chrome_mix_extension/manifest.json').is_file() and (p/'radio_plugins/focus/yt_dlp_plugins/extractor/focus_radio.py').is_file()"
      - uses: actions/upload-artifact@v7
        with:
          name: python-package
          path: dist/*
          if-no-files-found: error

  desktop:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, windows-2022, macos-15, macos-15-intel]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: pip
      - name: Install Linux player and display
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y mpv xvfb xauth
      - name: Install macOS player
        if: runner.os == 'macOS'
        env:
          HOMEBREW_NO_AUTO_UPDATE: 1
        run: brew list mpv >/dev/null 2>&1 || brew install mpv
      - name: Install Windows player
        if: runner.os == 'Windows'
        run: choco install mpv -y --no-progress
      - name: Install application and test tools
        run: python -m pip install . pytest "pyinstaller>=6.11" build
      - name: Run desktop tests with real mpv
        shell: bash
        env:
          PYTHONUTF8: '1'
        run: |
          export FOCUS_HOME="$RUNNER_TEMP/focus-ci"
          mpv --version
          python -m compileall -q main.py focus_app.py src tests
          python -m pip check
          if [[ "$RUNNER_OS" == Linux ]]; then
            xvfb-run -a python -m pytest -q
          else
            python -m pytest -q
          fi
      - name: Build native desktop archive
        run: python build.py
      - name: Start the packaged GUI and check its helpers
        shell: bash
        run: |
          if [[ "$RUNNER_OS" == macOS ]]; then
            app="dist/Ultimate Focus.app/Contents/MacOS/Ultimate Focus"
            tools="dist/Ultimate Focus.app/Contents/Helpers"
          else
            app="dist/Ultimate Focus/Ultimate Focus"
            tools="dist/Ultimate Focus/player-tools"
          fi
          if [[ "$RUNNER_OS" == Windows ]]; then app="$app.exe"; fi
          "$tools/yt-dlp" --version
          "$tools/deno" --version
          if [[ "$RUNNER_OS" == Linux ]]; then xvfb-run -a "$app" --self-test; else "$app" --self-test; fi
      - uses: actions/upload-artifact@v7
        with:
          name: native-${{ matrix.os }}
          path: dist/ultimate-focus-timer-*
          if-no-files-found: error
          compression-level: 0

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [desktop, package]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6
      - uses: actions/download-artifact@v8
        with:
          path: assets
          merge-multiple: true
      - name: Publish checked archives
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python -c "import os, runpy; assert os.environ['GITHUB_REF_NAME'] == 'v' + runpy.run_path('src/__version__.py')['__version__']"
          cd assets
          test "$(find . -maxdepth 1 -type f | wc -l)" -eq 6
          sha256sum * > SHA256SUMS
          gh release create "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --verify-tag --draft --title "Ultimate Focus Timer $GITHUB_REF_NAME" --notes-file "$GITHUB_WORKSPACE/docs/RELEASE.md" *
          gh release edit "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --draft=false --latest
